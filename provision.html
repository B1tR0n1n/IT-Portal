<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Provision — Schneider Geomatics IT Portal</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/css/portal.css">
<style>
  .prov { display:grid; grid-template-columns:230px 1fr; gap:0; min-height:calc(100vh - 132px); }
  .steprail { border-right:1px solid var(--border); padding:36px 26px 36px 32px; }
  .steprail ol { list-style:none; margin:0; padding:0; }
  .steprail li { display:flex; gap:11px; align-items:baseline; font-family:var(--mono); font-size:10px;
                 font-weight:500; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim);
                 padding:8px 0; transition:color .3s ease; }
  .steprail li .n { color:var(--border-lt); transition:color .3s ease; }
  .steprail li.done { color:var(--text); } .steprail li.done .n { color:var(--accent-dim); }
  .steprail li.active, .steprail li.active .n { color:var(--accent); }
  .bar { height:1px; background:var(--border); }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .3s ease; }
  .pane { display:flex; align-items:flex-start; justify-content:center; padding:44px 40px 70px; }
  .card { background:var(--bg2); border:1px solid var(--border); width:100%; max-width:680px; padding:40px 44px 32px; }
  .card.in { animation:fadeUp .34s ease both; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  .card h2 { font-size:clamp(26px,3.2vw,38px); margin:0 0 18px; }
  .card .rule { margin-bottom:26px; }
  .help { font-size:17px; color:var(--text-dim); margin:-12px 0 26px; max-width:60ch; }
  .choices { display:grid; gap:6px; }
  .choice { display:flex; align-items:center; gap:13px; border:1px solid var(--border); border-left:2px solid var(--border);
            background:var(--bg); padding:12px 15px; cursor:pointer; font-size:17px; color:var(--text);
            transition:border-color .3s ease, background .3s ease, color .3s ease; }
  .choice:hover { background:var(--accent-glow); }
  .choice input { width:15px; height:15px; accent-color:var(--accent); cursor:pointer; }
  .choice.on { border-left-color:var(--accent); color:var(--text-bright); }
  .actions { display:flex; align-items:center; gap:12px; margin-top:30px; padding-top:20px; border-top:1px solid var(--border); }
  .spacer { flex:1; }
  .review { max-width:900px; }
  .group { margin-bottom:26px; }
  .group h3 { margin-bottom:10px; }
  .kv { display:grid; grid-template-columns:230px 1fr auto; gap:0 16px; align-items:baseline; }
  .kv .k { font-family:var(--mono); font-size:10px; letter-spacing:1.4px; text-transform:uppercase; color:var(--text-dim); padding:7px 0; }
  .kv .v { font-family:var(--mono); font-size:13px; color:var(--text-bright); padding:7px 0; }
  .kv .v.empty { color:var(--border-lt); }
  .kv .edit { background:none; border:none; color:var(--text-dim); font-size:9px; letter-spacing:1.6px; padding:7px 4px; cursor:pointer; }
  .kv .edit:hover { color:var(--accent); }
  .outputs { display:grid; gap:8px; }
  .out { display:flex; align-items:center; gap:16px; border:1px solid var(--border); border-left:2px solid var(--accent-dim);
         background:var(--bg); padding:16px 18px; transition:background .3s ease, border-color .3s ease; }
  .out:hover { background:var(--accent-glow); border-left-color:var(--accent); }
  .out div { flex:1; }
  .out strong { display:block; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:2px;
                text-transform:uppercase; color:var(--text-bright); margin-bottom:4px; }
  .out span { font-size:16px; color:var(--text-dim); }
  @media (max-width:820px) {
    .prov { grid-template-columns:1fr; }
    .steprail { display:none; }
    .pane { padding:24px 16px 50px; }
    .card { padding:26px 20px 22px; }
    .kv { grid-template-columns:1fr auto; }
    .kv .k { grid-column:1 / -1; padding-bottom:0; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<svg class="noise" xmlns="http://www.w3.org/2000/svg"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#grain)"/></svg>

<div class="shell">
  <header class="topbar">
    <a class="mark" href="index.html"><img src="assets/img/logo.png" alt="Schneider Geomatics"></a>
    <div class="sitename"><b>IT Portal</b>Provisioning &amp; asset control</div>
    <nav class="topnav">
      <a href="index.html">Home</a>
      <a href="provision.html" aria-current="page">Provision</a>
      <a href="checklist.html">Build checklist</a>
      <a href="forms.html">Forms</a>
      <button class="lockstate" id="lockbtn">Locked</button>
    </nav>
  </header>
  <div class="prov">
    <nav class="steprail"><ol id="rail"></ol></nav>
    <main>
      <div class="bar"><div id="bar"></div></div>
      <div class="pane"><div class="card" id="card"></div></div>
    </main>
  </div>
  <footer class="site">
    <span>Schneider Geomatics · Information Technology</span>
    <span>Form SG-IT-014 Rev 2.0</span>
    <span>Internal use only</span>
  </footer>
</div>

<script>window.SITE_ROOT = "./";</script>
<script src="assets/js/vault.js"></script>
<script src="assets/js/pdf-lib.min.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
